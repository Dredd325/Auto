<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Перекуп Авто">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Перекуп Авто</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<div id="authScreen" class="screen active">
  <div class="auth-box">
    <h1>🚗 ПЕРЕКУП АВТО</h1>
    <p class="subtitle">Покупай. Чини. Продавай дороже.</p>
    <div class="tabs">
      <button class="tab active" data-tab="login">Вход</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>
    <div id="loginForm" class="form active">
      <input type="text" id="loginNick" placeholder="Ник" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password">
      <button class="btn-primary" onclick="doLogin()">Войти</button>
      <p id="loginError" class="error"></p>
    </div>
    <div id="registerForm" class="form">
      <input type="text" id="regNick" placeholder="Ник (3-16 символов)" autocomplete="username">
      <input type="password" id="regPass" placeholder="Пароль (мин. 4 символа)" autocomplete="new-password">
      <button class="btn-primary" onclick="doRegister()">Создать аккаунт</button>
      <p id="regError" class="error"></p>
    </div>
    <p class="note">💾 Аккаунт сохраняется локально в браузере</p>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="gameScreen" class="screen">
  <header class="topbar">
    <div class="balance">💰 <span id="balance">0</span> ₽</div>
    <div class="user">👤 <span id="userNick"></span></div>
    <button class="btn-exit" onclick="logout()">Выйти</button>
  </header>

  <div class="level-bar">
    <div>Уровень <span id="level">1</span></div>
    <div class="progress"><div id="progressFill" class="progress-fill"></div></div>
    <div><span id="xp">0</span>/<span id="xpMax">100</span> XP</div>
  </div>

  <nav class="navbar">
    <button class="nav-btn active" data-page="garage">🏠 Гараж</button>
    <button class="nav-btn" data-page="market">🛒 Рынок</button>
    <button class="nav-btn" data-page="repair">🔧 Ремонт</button>
    <button class="nav-btn" data-page="profile">👤 Профиль</button>
  </nav>

  <main id="mainContent"></main>

  <!-- ТУТОРИАЛ -->
  <div id="tutorial" class="tutorial hidden">
    <div class="tut-box">
      <h3 id="tutTitle"></h3>
      <p id="tutText"></p>
      <button class="btn-primary" onclick="nextTutorial()">Далее</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
